<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concentric Circles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h2>Concentric Circles (10px, 20px, 30px)</h2>
    <div class="wrapper">
      <div class="circle c1">
        <div class="circle c2">
          <div class="circle c3"></div>
        </div>
      </div>
    </div>
    <p class="info">Red: 30px radius | Yellow: 20px radius | Green: 10px radius</p>
  </div>
</body>
</html>
